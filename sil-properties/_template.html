<!-- Main content of a SIL property detail page. tools/build_sil_properties.py fills the {{TOKENS}}
     from properties.json and wraps this in the site header and footer. Do not open this file directly. -->
<section aria-labelledby="property-heading" style="background: #edf4f6">
<div class="r-pad" style="max-width: 1440px; margin: 0 auto; padding: 40px 64px 56px; box-sizing: border-box">
<nav aria-label="Breadcrumb" style="font-size: 14px; color: #55676a"><a href="../index.html" style="color: #55676a">Home</a><span aria-hidden="true" style="margin: 0 10px">/</span><a href="../sil-vacancy.html" style="color: #55676a">SIL Vacancies</a><span aria-hidden="true" style="margin: 0 10px">/</span><span aria-current="page" style="color: #00565e; font-weight: 600">{{TITLE}}</span></nav>
<div class="pd-gallery" data-gallery style="margin-top: 24px; display: grid; grid-template-columns: 7fr 5fr; gap: 16px; align-items: start">
<img data-gallery-main src="{{MAIN_SRC}}" alt="{{MAIN_ALT}}" fetchpriority="high" style="display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 24px; background: #cfe0e4">
<div class="pd-thumbs-wrap" style="position: relative; align-self: stretch">
<div class="pd-thumbs" style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat({{THUMB_ROWS}}, minmax(0, 1fr)); gap: 12px">
{{THUMBS}}
</div>
</div>
</div>
<div style="margin-top: 36px">
<p style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; color: #0a7f7d"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0A11 11 0 0 0 1 11c0 8.3 11 17 11 17s11-8.7 11-17A11 11 0 0 0 12 0zm0 15a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"></path></svg>{{LOCATION}}</p>
<h1 id="property-heading" class="r-h2" style="margin: 10px 0 0; font-size: 46px; line-height: 1.15; font-weight: 600; color: #2f3b3d">{{TITLE}}</h1>
<p style="margin: 10px 0 0; font-size: 18px; font-weight: 300; color: #3d4a4c">{{SUBTITLE}}</p>
<p style="margin: 18px 0 0"><span style="display: inline-block; padding: 10px 18px; border-radius: 22px; background: #00565e; color: #ffffff; font-size: 15px; font-weight: 600">{{VACANCY_BADGE}}</span></p>
</div>
</div>
</section>
<section aria-label="Property details" style="background: #ffffff">
<div class="r-pad pd-layout" style="max-width: 1440px; margin: 0 auto; padding: 64px 64px 104px; box-sizing: border-box; display: grid; grid-template-columns: 8fr 4fr; gap: 56px; align-items: start">
<div>
<dl class="pd-facts" style="margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
{{FACTS}}
</dl>
{{SECTIONS}}
<p style="margin: 40px 0 0"><a href="../sil-vacancy.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 17px; font-weight: 600; color: #00565e"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>Back to all SIL vacancies</a></p>
</div>
<aside class="pd-enquiry" aria-labelledby="enquiry-heading" style="position: sticky; top: 24px; background: #edf4f6; border-radius: 24px; padding: 32px 28px">
<h2 id="enquiry-heading" style="margin: 0; font-size: 26px; line-height: 1.25; font-weight: 600; color: #2f3b3d">Enquire about this home</h2>
<p style="margin: 8px 0 0; font-size: 15px; line-height: 1.6; font-weight: 300; color: #3d4a4c">Tell us a little about yourself and your support needs, and our team will be in touch.</p>
<form aria-labelledby="enquiry-heading" style="margin-top: 22px; display: flex; flex-direction: column; gap: 16px">
<input type="hidden" name="property" value="{{TITLE}}">
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600; color: #2f3b3d"><span>Full Name <span style="font-weight: 400; color: #55676a">(required)</span></span><input name="full-name" type="text" required autocomplete="name" style="height: 50px; border: 1px solid #cfdcdf; border-radius: 12px; padding: 0 16px; background: #ffffff; font-family: inherit; font-size: 16px; color: #2f3b3d"></label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600; color: #2f3b3d"><span>Email Address <span style="font-weight: 400; color: #55676a">(required)</span></span><input name="email-address" type="email" required autocomplete="email" style="height: 50px; border: 1px solid #cfdcdf; border-radius: 12px; padding: 0 16px; background: #ffffff; font-family: inherit; font-size: 16px; color: #2f3b3d"></label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600; color: #2f3b3d"><span>Phone Number <span style="font-weight: 400; color: #55676a">(required)</span></span><input name="phone-number" type="tel" required autocomplete="tel" style="height: 50px; border: 1px solid #cfdcdf; border-radius: 12px; padding: 0 16px; background: #ffffff; font-family: inherit; font-size: 16px; color: #2f3b3d"></label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600; color: #2f3b3d"><span>Message <span style="font-weight: 400; color: #55676a">(required)</span></span><textarea name="message" rows="4" required style="border: 1px solid #cfdcdf; border-radius: 12px; padding: 14px 16px; background: #ffffff; font-family: inherit; font-size: 16px; color: #2f3b3d; resize: vertical"></textarea></label>
<button type="submit" class="r-btn r-btn-brand" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 30px; border: 0; border-radius: 28px; background: #00565e; color: #ffffff; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer">Send Enquiry</button>
</form>
<p style="margin: 22px 0 0; padding-top: 18px; border-top: 1px solid #cfdcdf; font-size: 15px; font-weight: 300; color: #3d4a4c">Prefer to talk? Call <a href="tel:1800862427" style="color: #00565e; font-weight: 600">1800 862 427</a></p>
</aside>
</div>
</section>
